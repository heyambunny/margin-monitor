<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>Offline · Margin Monitor</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0b0e1a; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; text-align: center;
    }
    .icon { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 20px; display: block; box-shadow: 0 12px 30px rgba(99,102,241,.35); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: rgba(255,255,255,.6); font-size: 14px; line-height: 1.5; margin: 0 auto 24px; max-width: 320px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 22px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6); box-shadow: 0 10px 24px rgba(59,130,246,.3);
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Margin Monitor needs an internet connection to show your billing data. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
